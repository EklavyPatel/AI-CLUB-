[project]
name = "beyond-the-number-college"
version = "4.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "sqlalchemy>=2.0.25",
  "pydantic>=2.5.0",
  "pypdf>=6.0,<8",
  "python-multipart>=0.0.22,<0.1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "httpx[http2]>=0.27,<1"
]

[tool.vercel]
entrypoint = "main:app"

[tool.fastapi]
entrypoint = "main:app"
